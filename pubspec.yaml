name: hunarsangam
description: "HunarSangam Bulk Buyer & Craft Maker Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  supabase_flutter: ^2.6.0
  http: ^1.2.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
